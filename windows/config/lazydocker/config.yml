# LazyDocker supports only these four theme colors.
# Themes: exactly one `gui:` block may be uncommented.

# Default Dark Modern (VS Code). Active.
gui:
  theme:
    activeBorderColor:
      - "#C586C0"
      - bold
    inactiveBorderColor:
      - "#6e7681"
    optionsTextColor:
      - "#569CD6"
    selectedLineBgColor:
      - "#37373d"

