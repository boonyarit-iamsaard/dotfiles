git:
  log:
    showWholeGraph: true
  overrideGpg: true

# Themes: exactly one `gui:` block may be uncommented.

# Default Dark Modern (VS Code). Active.
gui:
  theme:
    activeBorderColor:
      - "#C586C0"
      - bold
    inactiveBorderColor:
      - "#6e7681"
    searchingActiveBorderColor:
      - "#D7BA7D"
    optionsTextColor:
      - "#569CD6"
    selectedLineBgColor:
      - "#37373d"
    inactiveViewSelectedLineBgColor:
      - "#2b2b2b"
    cherryPickedCommitFgColor:
      - "#D7BA7D"
    cherryPickedCommitBgColor:
      - "#2b2b2b"
    markedBaseCommitFgColor:
      - "#569CD6"
    markedBaseCommitBgColor:
      - "#D7BA7D"
    unstagedChangesColor:
      - "#f85149"
    defaultFgColor:
      - "#cccccc"
    authorColors:
      "*": "#9CDCFE"

