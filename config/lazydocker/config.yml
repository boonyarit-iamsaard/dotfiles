# Theme variant contract: between markers, copy themes/<name>.yml exactly,
# removing only its leading comment lines and blank lines.
# >>> theme: default-dark-modern
gui:
  theme:
    activeBorderColor:
      - "#0078d4" # tab.activeBorderTop
      - bold
    inactiveBorderColor:
      - "#9d9d9d" # descriptionForeground
    optionsTextColor:
      - "#4daafc" # textLink.foreground
    selectedLineBgColor:
      - "#264f78" # editor.selectionBackground
# <<< theme
