source-file ~/.tmux/themes/extras/dark-2026.conf

# Local overrides of the upstream Theme extra.
set -g @custom_bg_alt '#242628'
set -g message-style "bg=#{@custom_bg_alt},fg=#{@custom_fg},fill=#{@custom_bg_alt}"
set -g message-command-style "bg=#{@custom_bg_alt},fg=#{@custom_fg},fill=#{@custom_bg_alt}"
# tmux 3.6+ chrome options default to grey "theme*" fills; -q keeps older tmux quiet.
set -gq tree-mode-border-style "bg=default,fg=#{@custom_gray}"
set -gq tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@custom_yellow},#{@custom_blue}}"
set -gq display-panes-border-style "bg=default,fg=#{@custom_gray}"
set -gF display-panes-colour "#{@custom_blue}"
set -gF display-panes-active-colour "#{@custom_yellow}"
set -gq menu-style "bg=#{@custom_bg_alt},fg=#{@custom_fg}"
set -gq menu-selected-style "bg=#{@custom_blue},fg=#{@custom_black}"
set -gq menu-border-style "bg=#{@custom_bg_alt},fg=#{@custom_gray}"
set -gq pane-scrollbars-style "bg=#{@custom_bg_alt},fg=#{@custom_bright_black},width=1,pad=0"
set -gq copy-mode-mark-style "bg=#{@custom_magenta},fg=#{@custom_black}"
set -gq copy-mode-line-number-style "fg=#{@custom_bright_black}"
set -gq copy-mode-current-line-number-style "fg=#{@custom_yellow}"

set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@custom_red},fg=#{@custom_bg},bold]  #S },#{#[bg=#{@custom_bg},fg=#{@custom_green}]  #S }}"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]│"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_cyan}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]│"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_yellow}]#{?window_zoomed_flag,  zoom ,}"

set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@custom_red},fg=#{@custom_bg}]},#{#[bg=#{@custom_bg},fg=#{@custom_magenta}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_gray}, none]│"
set -ga status-right "#[bg=#{@custom_bg}]#{?#{==:#{online_status},ok},#[fg=#{@custom_cyan}] 󰖩 on ,#[fg=#{@custom_red}]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_gray}, none]│"
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
