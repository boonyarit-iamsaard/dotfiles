# Dark 2026 for lazygit
#
# Merge into ~/.config/lazygit/config.yml (lazygit has no include mechanism, so
# the keys have to live in the config file itself).
#
# This themes lazygit run from a shell. It does NOT reach lazygit opened from
# Neovim via snacks.nvim (LazyVim's <leader>gg), which generates its own theme
# and appends it after this file -- use extras/lazyvim/lazygit.lua for that.

gui:
  theme:
    activeBorderColor:
      - "#3994bc" # tab.activeBorderTop
      - bold
    inactiveBorderColor:
      - "#8c8c8c" # descriptionForeground
    optionsTextColor:
      - "#48a0c7" # textLink.foreground
    selectedLineBgColor:
      - "#276782" # editor.selectionBackground, opaque base
    inactiveViewSelectedLineBgColor:
      - "#2c2d2e" # list.inactiveSelectionBackground
    cherryPickedCommitBgColor:
      - "#37373d" # tab.selectedBackground
    cherryPickedCommitFgColor:
      - "#e5ba7d" # gitDecoration.modifiedResourceForeground
    markedBaseCommitBgColor:
      - "#37373d" # tab.selectedBackground
    markedBaseCommitFgColor:
      - "#57a3f8" # charts.blue
    unstagedChangesColor:
      - "#f48771" # gitDecoration.deletedResourceForeground
    defaultFgColor:
      - "#cccccc" # terminal.foreground
    searchingActiveBorderColor:
      - "#e5ba7d" # gitDecoration.modifiedResourceForeground

  authorColors:
    "*": "#57a3f8" # charts.blue
