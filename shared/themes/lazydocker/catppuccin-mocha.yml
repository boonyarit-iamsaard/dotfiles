# Catppuccin Mocha for lazydocker. Hand port: Catppuccin ships no lazydocker
# theme, so these are the matching keys of the vendored lazygit theme
# (shared/themes/lazygit/catppuccin-mocha.yml). lazydocker supports only these
# four theme keys.
gui:
  theme:
    activeBorderColor:
      - "#b4befe"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
