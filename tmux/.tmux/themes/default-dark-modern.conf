# Default Dark Modern (VS Code). Hand-ported: no upstream extra exists.
# Hexes come from microsoft/vscode extensions/theme-defaults/themes/dark_modern.json
# (which includes dark_plus.json / dark_vs.json for token colors); keys the theme
# leaves unset fall back to VS Code's registered dark defaults.

# --- palette ------------------------------------------------------------------
set -g @custom_bg '#181818'             # panel.background
set -g @custom_bg_alt '#222222'         # quickInput.background (prompt/message bar)
set -g @custom_fg '#cccccc'             # terminal.foreground
set -g @custom_black '#1f1f1f'          # editor.background
set -g @custom_gray '#9d9d9d'           # descriptionForeground
set -g @custom_red '#f85149'            # errorForeground
set -g @custom_green '#81b88b'          # gitDecoration.addedResourceForeground
set -g @custom_yellow '#e2c08d'         # gitDecoration.modifiedResourceForeground
set -g @custom_blue '#4daafc'           # textLink.foreground
set -g @custom_magenta '#b180d7'        # charts.purple
set -g @custom_cyan '#9cdcfe'           # variable
set -g @custom_white '#cccccc'          # terminal.foreground
set -g @custom_orange '#d18616'         # charts.orange
set -g @custom_bright_black '#727272'   # disabledForeground (#cccccc80 over panel.background)
set -g @custom_bright_red '#f44747'     # invalid
set -g @custom_bright_green '#b5cea8'   # constant.numeric
set -g @custom_bright_yellow '#dcdcaa'  # entity.name.function
set -g @custom_bright_blue '#569cd6'    # keyword
set -g @custom_bright_magenta '#c586c0' # keyword.control
set -g @custom_bright_cyan '#4fc1ff'    # variable.other.constant
set -g @custom_bright_white '#ffffff'

# --- chrome -------------------------------------------------------------------
set -g status-style "bg=#{@custom_bg},fg=#{@custom_fg}"
set -g message-style "bg=#{@custom_bg_alt},fg=#{@custom_fg},fill=#{@custom_bg_alt}"
set -g message-command-style "bg=#{@custom_bg_alt},fg=#{@custom_fg},fill=#{@custom_bg_alt}"

setw -g pane-border-style "bg=#{@custom_bg},fg=#{@custom_gray}"
setw -g pane-active-border-style "bg=#{@custom_bg},fg=#{@custom_magenta}"

set -g window-status-style "bg=#{@custom_bg},fg=#{@custom_gray}"
set -g window-status-last-style "bg=#{@custom_bg},fg=#{@custom_yellow}"
set -g window-status-activity-style "bg=#{@custom_red},fg=#{@custom_bg}"
set -g window-status-bell-style "bg=#{@custom_red},fg=#{@custom_bg},bold"
set -g window-status-current-style "bg=#{@custom_yellow},fg=#{@custom_bg},bold"
set -gF window-status-separator "#[bg=#{@custom_bg},fg=#{@custom_gray}]│"

set -g mode-style "bg=#{@custom_blue},fg=#{@custom_black}"
set -g copy-mode-match-style "bg=#{@custom_bright_black},fg=#{@custom_fg}"
set -g copy-mode-current-match-style "bg=#{@custom_yellow},fg=#{@custom_black}"

# --- status line --------------------------------------------------------------
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@custom_red},fg=#{@custom_bg},bold]  #S },#{#[bg=#{@custom_bg},fg=#{@custom_green}]  #S }}"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]│"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_cyan}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]│"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_yellow}]#{?window_zoomed_flag,  zoom ,}"

set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@custom_red},fg=#{@custom_bg}]},#{#[bg=#{@custom_bg},fg=#{@custom_magenta}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_gray}, none]│"
set -ga status-right "#[bg=#{@custom_bg}]#{?#{==:#{online_status},ok},#[fg=#{@custom_cyan}] 󰖩 on ,#[fg=#{@custom_red}]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_gray}, none]│"
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
