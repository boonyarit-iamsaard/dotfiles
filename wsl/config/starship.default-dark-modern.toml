"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](seg_badge)\
$os\
$username\
[](bg:seg_dir fg:seg_badge)\
$directory\
[](fg:seg_dir bg:seg_git)\
$git_branch\
$git_status\
[](fg:seg_git bg:seg_lang)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$dotnet\
[](fg:seg_lang bg:seg_env)\
$docker_context\
$conda\
[](fg:seg_env bg:seg_time)\
$time\
[ ](fg:seg_time)\
$line_break$character"""

# Command duration on the right, shown only for commands slower than 2s.
right_format = "$cmd_duration"

# Prompt shown for multi-line input.
continuation_prompt = "[∙∙ ](muted)"

palette = 'default_dark_modern'

[palettes.default_dark_modern]
seg_badge = '#0078d4'         # statusBarItem.remoteBackground
text_badge = '#ffffff'        # statusBarItem.remoteForeground
seg_dir = '#4b4132'           # gitDecoration.modifiedResourceForeground hue, L 0.38
text_dir = '#e2c08d'          # gitDecoration.modifiedResourceForeground
seg_git = '#2d3d30'           # gitDecoration.addedResourceForeground hue, L 0.34
text_git = '#81b88b'          # gitDecoration.addedResourceForeground
seg_lang = '#1b3043'          # textLink.foreground hue, L 0.3
text_lang = '#4daafc'         # textLink.foreground
seg_env = '#1f303a'           # variable hue, L 0.3
text_env = '#9cdcfe'          # variable
seg_time = '#222222'          # quickInput.background
text_time = '#9d9d9d'         # descriptionForeground
color_fg1 = '#cccccc'         # terminal.foreground
color_green = '#81b88b'       # gitDecoration.addedResourceForeground
color_red = '#f85149'         # errorForeground
muted = '#9d9d9d'             # descriptionForeground

[os]
disabled = false
style = "bg:seg_badge fg:text_badge"

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "bg:seg_badge fg:text_badge"
style_root = "bg:seg_badge fg:text_badge"
format = '[ $user ]($style)'

[directory]
style = "fg:text_dir bg:seg_dir"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:seg_git"
format = '[[ $symbol $branch ](fg:text_git bg:seg_git)]($style)'

[git_status]
style = "bg:seg_git"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"
up_to_date = "≡"
format = '[[($all_status$ahead_behind )](fg:text_git bg:seg_git)]($style)'

[nodejs]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[c]
symbol = " "
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[rust]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[golang]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[php]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[java]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[kotlin]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[haskell]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[python]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[dotnet]
symbol = ""
style = "bg:seg_lang"
format = '[[ $symbol( $version) ](fg:text_lang bg:seg_lang)]($style)'

[docker_context]
symbol = ""
style = "bg:seg_env"
format = '[[ $symbol( $context) ](fg:text_env bg:seg_env)]($style)'

[conda]
style = "bg:seg_env"
format = '[[ $symbol( $environment) ](fg:text_env bg:seg_env)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:seg_time"
format = '[[  $time ](fg:text_time bg:seg_time)]($style)'

[cmd_duration]
min_time = 2000
style = "fg:muted"
format = "[took $duration]($style)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[[󰄛](color_green) ❯](color_green)"
error_symbol = "[[󰄛](color_red) ❯](color_red)"
vimcmd_symbol = "[󰄛 ❮](color_fg1)"
