# Theme variant contract: between markers, copy themes/<name>.yml exactly,
# removing only its leading comment lines and blank lines.
# >>> theme: dark-2026
gui:
  theme:
    activeBorderColor:
      - "#3994bc" # tab.activeBorderTop
      - bold
    inactiveBorderColor:
      - "#8c8c8c" # descriptionForeground
    optionsTextColor:
      - "#48a0c7" # textLink.foreground
    selectedLineBgColor:
      - "#276782" # editor.selectionBackground, opaque base
# <<< theme
