# removing only its leading comment lines and blank lines.
# >>> theme: catppuccin-macchiato
gui:
  theme:
    activeBorderColor:
      - "#b7bdf8"
      - bold
    inactiveBorderColor:
      - "#a5adcb"
    optionsTextColor:
      - "#8aadf4"
    selectedLineBgColor:
      - "#363a4f"
# <<< theme
