# ==============================================================================
# Custom Colorscheme Variables (Dark 2026)
# ==============================================================================
# Define your colors here. Use tmux color names (e.g., red, green, blue)
# or hex codes (e.g., '#ff0000') or colourXXX codes (e.g., colour235).
set -g @custom_bg '#191a1b'             # panel.background
set -g @custom_fg '#cccccc'             # terminal.foreground
set -g @custom_black '#121314'          # editor.background
set -g @custom_gray '#8c8c8c'           # descriptionForeground
set -g @custom_red '#f48771'            # errorForeground
set -g @custom_green '#73c991'          # gitDecoration.addedResourceForeground
set -g @custom_yellow '#e5ba7d'         # gitDecoration.modifiedResourceForeground
set -g @custom_blue '#48a0c7'           # textLink.foreground
set -g @custom_magenta '#ad80d7'        # charts.purple
set -g @custom_cyan '#a5d6ff'           # string
set -g @custom_white '#cccccc'          # terminal.foreground
set -g @custom_orange '#e2c08d'         # gitDecoration.untrackedResourceForeground
set -g @custom_bright_black '#555555'   # disabledForeground
set -g @custom_bright_red '#ff7b72'     # keyword
set -g @custom_bright_green '#7ee787'   # entity.name.tag
set -g @custom_bright_yellow '#e0b97f'  # charts.yellow
set -g @custom_bright_blue '#57a3f8'    # charts.blue
set -g @custom_bright_magenta '#d2a8ff' # entity.name.function
set -g @custom_bright_cyan '#79c0ff'    # constant
set -g @custom_bright_white '#ffffff'

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

set -g prefix C-s
set -g mouse on
set -ga terminal-overrides ",xterm-256color:Tc"
set-option -g update-environment "SSH_AUTH_SOCK DISPLAY"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

# status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@custom_red},fg=#{@custom_black},bold]  #S },#{#[bg=#{@custom_bg},fg=#{@custom_green}]  #S }}"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]│"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_cyan}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]│"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_gray},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@custom_bg},fg=#{@custom_yellow}]#{?window_zoomed_flag,  zoom ,}"

# status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@custom_red},fg=#{@custom_black}]},#{#[bg=#{@custom_bg},fg=#{@custom_magenta}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_gray},none]│"
set -ga status-right "#[bg=#{@custom_bg}]#{?#{==:#{online_status},ok},#[fg=#{@custom_magenta}] 󰖩 on ,#[fg=#{@custom_red}]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_gray},none]│"
set -ga status-right "#[bg=#{@custom_bg},fg=#{@custom_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "

# Configure tmux
set -g status-position top
set -g status-style "bg=#{@custom_bg},fg=#{@custom_fg}"
set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@custom_bg},fg=#{@custom_magenta}"
setw -g pane-border-style "bg=#{@custom_bg},fg=#{@custom_gray}"
setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@custom_bg},fg=#{@custom_gray}"
set -g window-status-last-style "bg=#{@custom_bg},fg=#{@custom_yellow}"
set -g window-status-activity-style "bg=#{@custom_red},fg=#{@custom_black}"
set -g window-status-bell-style "bg=#{@custom_red},fg=#{@custom_black},bold"
set -gF window-status-separator "#[bg=#{@custom_bg},fg=#{@custom_gray}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@custom_yellow},fg=#{@custom_black},bold"

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
