# Configure the Theme before loading its plugin.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_pane_border_status "off"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"

if "test ! -d ~/.tmux/plugins/tmux" "run 'git clone -b v2.3.0 https://github.com/catppuccin/tmux.git ~/.tmux/plugins/tmux'"
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Local styles must follow the plugin, which also sets these options.
set -g status-style "bg=default"
set -g message-style "bg=#{@thm_surface_0},fg=#{@thm_fg},fill=#{@thm_surface_0}"
set -g message-command-style "bg=#{@thm_surface_0},fg=#{@thm_fg},fill=#{@thm_surface_0}"
setw -g pane-active-border-style "bg=default,fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=default,fg=#{@thm_surface_0}"
# tmux 3.6+ chrome options default to grey "theme*" fills; -q keeps older tmux quiet.
set -gq tree-mode-border-style "bg=default,fg=#{@thm_surface_1}"
set -gq tree-mode-preview-style "fg=#{?#{||:#{&&:#{pane_format},#{pane_active}},#{&&:#{window_format},#{window_active}}},#{@thm_peach},#{@thm_blue}}"
set -gq display-panes-border-style "bg=default,fg=#{@thm_surface_1}"
set -gF display-panes-colour "#{@thm_blue}"
set -gF display-panes-active-colour "#{@thm_peach}"
set -gq menu-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gq menu-border-style "bg=#{@thm_bg},fg=#{@thm_surface_1}"
set -gq pane-scrollbars-style "bg=#{@thm_surface_0},fg=#{@thm_overlay_0},width=1,pad=0"
set -gq copy-mode-match-style "bg=#{@thm_teal},fg=#{@thm_bg}"
set -gq copy-mode-current-match-style "bg=#{@thm_peach},fg=#{@thm_bg}"
set -gq copy-mode-mark-style "bg=#{@thm_yellow},fg=#{@thm_bg}"
set -gq copy-mode-line-number-style "fg=#{@thm_overlay_0}"
set -gq copy-mode-current-line-number-style "fg=#{@thm_yellow}"
set -g window-status-style "bg=default,fg=#{@thm_rosewater}"
set -g window-status-last-style "bg=default,fg=#{@thm_peach}"
set -g window-status-activity-style "bg=default,fg=#{@thm_red}"
set -g window-status-bell-style "bg=default,fg=#{@thm_red},bold"
set -g window-status-separator "#[bg=default,fg=#{@thm_overlay_0}]│"
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"

set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=default,fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=default,fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=default,fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=default,fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=default,fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

set -g status-right ""
set -ga status-right "#{?#{e|>=:10,#{battery_percentage}},#{#[bg=#{@thm_red},fg=#{@thm_bg}]},#{#[bg=default,fg=#{@thm_pink}]}} #{battery_icon} #{battery_percentage} "
set -ga status-right "#[bg=default,fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=default]#{?#{==:#{online_status},ok},#[fg=#{@thm_mauve}] 󰖩 on ,#[fg=#{@thm_red}]#[reverse] 󰖪 off }"
set -ga status-right "#[bg=default,fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=default,fg=#{@thm_blue}] 󰭦 %Y-%m-%d 󰅐 %H:%M "
