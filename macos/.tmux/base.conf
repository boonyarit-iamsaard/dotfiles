unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

set -g prefix C-s
set -g mouse on
# Fixed index keeps reloads idempotent (-ga appended a copy on every source-file).
set -g terminal-overrides[1] "xterm-256color:Tc"
set-option -g update-environment "SSH_AUTH_SOCK DISPLAY"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# List of plugins
# Catppuccin is loaded by its Theme variant; TPM clean must not remove plugins/tmux.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @batt_icon_charge_tier8 '󰁹'
set -g @batt_icon_charge_tier7 '󰂂'
set -g @batt_icon_charge_tier6 '󰂁'
set -g @batt_icon_charge_tier5 '󰂀'
set -g @batt_icon_charge_tier4 '󰁿'
set -g @batt_icon_charge_tier3 '󰁾'
set -g @batt_icon_charge_tier2 '󰁽'
set -g @batt_icon_charge_tier1 '󰁼'
set -g @batt_icon_status_charged '󰁹'
set -g @batt_icon_status_charging '󰂄'
set -g @batt_icon_status_discharging '󰁺'
set -g @batt_icon_status_attached '󰚥'
set -g @batt_icon_status_unknown '󰁽'

set -g status-left-length 100
set -g status-right-length 100

# bootstrap tpm
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# The entry point selects @theme before loading this shared base.
# Theme variants must set status formats before TPM interpolates battery/online placeholders.
source-file -F '#{HOME}/.tmux/themes/#{@theme}.conf'

# Configure Tmux
set -g status-position top

set -g status-justify "absolute-centre"

# pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""

setw -g pane-border-lines single

# window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Window"

set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "

set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "

# Initialize TPM after the Theme variant's status formats.
run '~/.tmux/plugins/tpm/tpm'
